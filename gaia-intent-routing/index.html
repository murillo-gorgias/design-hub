<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent intent routing microanimation</title>
  <meta name="robots" content="noindex, nofollow" />
  <!--
    AI Agent intent routing, an onboarding illustration (760 x 276). Design exploration.

    One card in the centre of the box, with the next tickets stacked behind it. The card holds
    the customer's message, and one row under it that fills in from left to right: intent, skill,
    then who takes the ticket. On a response, AI Agent's mark moves into its badge and a sage
    field covers the box. On a handover, a person's badge appears and the box keeps its colour.
    One loop = three tickets, about 15 s.

    The three dots under the card jump to a ticket. ?t=<seconds> freezes the loop.
    Reduced motion shows the first ticket's finished response, still.
  -->
  <style>
    @font-face {
      font-family: "Red Hat Mono";
      font-weight: 500;
      font-style: normal;
      font-display: block;
      src: url(assets/fonts/RedHatMono-Medium-Web.woff2) format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
      src: url(assets/fonts/InterVariable.woff2) format("woff2");
    }
    :root {
      --cream: #F8F5F1;
      --paper: #FCFAF8;
      --white: #FFFFFF;
      --ink: #1B1A19;
      --text: #5F5C59;
      --mute: #8E8985;
      --border: #E8E2DC;
      --peach: #FFEAE6;
      --periwinkle: #C7CCFD;
      --sage-field: #D6EED0;   /* Sage at 70% over cream: a calmer field for a box that loops in the product */
      --lift: 0 1px 2px rgba(27,26,25,.05), 0 10px 26px rgba(27,26,25,.07);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    p { margin: 0; }

    .microanimation {
      position: relative;
      width: min(100%, 760px);
      aspect-ratio: 760 / 276;
      overflow: hidden;
      border-radius: 8px;
      background: var(--cream);
    }
    /* Drawing surface, always 760 x 276, scaled down to the box when it is narrower. */
    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 760px;
      height: 276px;
      transform-origin: 0 0;
      visibility: hidden;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* Flat sage field. It opens from the outcome and covers the box. */
    .wash { position: absolute; inset: 0; background: var(--sage-field); clip-path: circle(0 at 0 0); }
    .scene { position: absolute; inset: 0; }

    /* The stack of tickets */
    .card {
      position: absolute;
      left: 0;
      top: 0;
      width: 520px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: var(--lift);
      transform-origin: 50% 0;
      will-change: transform, opacity;
    }
    .card.ghost { height: 72px; }   /* same as the closed ticket, so the stack hands over cleanly */

    /* The customer's message, with AI Agent's mark beside it */
    .ask { display: flex; align-items: center; justify-content: space-between; height: 70px; padding: 0 22px 0 24px; }
    .message {
      position: relative;
      width: max-content;
      color: var(--ink);
      font-size: 20px;
      letter-spacing: -.015em;
      line-height: 28px;
      white-space: nowrap;
    }
    .message-text { position: relative; }
    .sweep { position: absolute; left: -6px; top: 0; width: 0; height: 28px; border-radius: 6px; background: var(--peach); }
    .agent { position: relative; z-index: 1; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); opacity: 0; }
    .agent svg { width: 15px; height: 15px; }

    /* What AI Agent works out, left to right: intent, skill, outcome */
    .route { display: flow-root; height: 0; overflow: hidden; }
    .route-row {
      display: grid;
      grid-template-columns: 150px 112px 1fr;
      column-gap: 30px;
      margin: 0 24px;
      padding: 15px 0 20px;
      border-top: 1px solid var(--border);
    }
    .step { position: relative; display: flex; flex-direction: column; gap: 5px; opacity: 0; }
    .mono {
      color: var(--text);
      font-family: "Red Hat Mono", ui-monospace, Menlo, monospace;
      font-size: 10px;
      letter-spacing: .08em;
      line-height: 12px;
      text-transform: uppercase;
    }
    .value { color: var(--ink); font-size: 13.5px; line-height: 18px; white-space: nowrap; }
    .step.is-empty .value { color: var(--mute); }
    /* The outcome is a small profile badge: who takes the ticket. */
    .badge {
      display: flex;
      align-items: center;
      align-self: flex-start;
      gap: 7px;
      height: 26px;
      margin: -4px 0;                /* the badge is taller than a line of text; keep the row's height */
      padding: 0 11px 0 3px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--cream);
      transform-origin: 0 50%;
    }
    .avatar { display: grid; place-items: center; width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; background: var(--ink); color: var(--paper); }
    .avatar svg { width: 12px; height: 12px; }
    /* AI Agent's badge keeps an empty place for the mark, which travels into it. */
    .badge:not(.is-human) .avatar { visibility: hidden; }
    .badge.is-human .avatar { background: var(--periwinkle); color: var(--ink); }
    .arrow { position: absolute; left: -24px; top: 21px; width: 18px; height: 10px; color: var(--mute); transform-origin: 0 50%; }

    /* Jump to a ticket. One dot per example; the current one is a bar that fills as it plays. */
    .examples { position: absolute; left: 0; top: 229px; display: flex; justify-content: center; width: 760px; }
    .dots { position: relative; display: flex; align-items: center; gap: 2px; }
    .dots button { all: unset; display: grid; place-items: center; height: 20px; padding: 0 3px; cursor: pointer; }
    .dots button span { display: block; width: 6px; height: 6px; overflow: hidden; border-radius: 3px; background: rgba(27,26,25,.18); transition: width .3s cubic-bezier(.16,1,.3,1), background-color .2s; }
    .dots button:hover span { background: rgba(27,26,25,.34); }
    .dots button.is-active span { width: 22px; background: rgba(27,26,25,.18); }
    .dots button b { display: block; width: 100%; height: 100%; background: rgba(27,26,25,.62); transform: scaleX(0); transform-origin: 0 50%; }
    .dots button:focus-visible span { outline: 2px solid var(--ink); outline-offset: 3px; }
    .hint { position: absolute; left: 100%; top: 2px; margin-left: 8px; color: var(--text); font-size: 11.5px; line-height: 16px; white-space: nowrap; opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; pointer-events: none; }
    .hint.is-shown { opacity: 1; transform: none; }
    .is-still .dots button span { transition: none; }
  </style>
</head>
<body>

      <symbol id="person" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 12.2a4.1 4.1 0 1 0 0-8.2 4.1 4.1 0 0 0 0 8.2zM4.6 20.4c.9-3.3 3.8-5.2 7.4-5.2s6.5 1.9 7.4 5.2" /></symbol>

  <section class="microanimation" aria-labelledby="summary">
    <p id="summary" class="sr-only">AI Agent reads each incoming ticket and names its intent. When one of your skills matches the intent, AI Agent replies using that skill. When no skill matches, your team takes over.</p>
    <div class="stage">
      <div class="wash" aria-hidden="true"></div>

      <div class="scene" aria-hidden="true">
        <div class="card ghost"></div>
        <div class="card ghost"></div>
        <div class="card front">
          <div class="card-body">
            <div class="ask">
              <p class="message"><span class="sweep"></span><span class="message-text"></span></p>
              <span class="agent"><svg><use href="#mark" /></svg></span>
            </div>
            <div class="route">
              <div class="route-row">
                <div class="step"><span class="mono">Intent</span><span class="value"></span></div>
                <div class="step"><svg class="arrow"><use href="#arrow" /></svg><span class="mono">Skill</span><span class="value"></span></div>
                <div class="step">
                  <svg class="arrow"><use href="#arrow" /></svg><span class="mono"></span>
                  <span class="badge">
                    <span class="avatar"><svg><use href="#person" /></svg></span>
                    <span class="value"></span>
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <nav class="examples" aria-label="Example tickets">
        <div class="dots">
          <button type="button"><span><b></b></span></button>
          <button type="button"><span><b></b></span></button>
          <button type="button"><span><b></b></span></button>
          <span class="hint" aria-hidden="true"></span>
        </div>
      </nav>
    </div>
  </section>

  <script>
    (() => {
      // The two responses play first. The handover comes last.
      const TICKETS = [
        { message: "Where is my order?", intent: "Order status", skill: "Track order", outcome: "response" },
        { message: "Do you ship to Canada?", intent: "International shipping", skill: "Shipping policy", outcome: "response" },
        { message: "An item is missing from my order", intent: "Missing item", skill: null, outcome: "handover" },
      ];
      const NO_SKILL = "No match";
      // at: when the outcome appears. exit: when the card starts to close. length: seconds one ticket takes.
      const OUTCOME = {
        response: { label: "Response", who: "AI Agent", human: false, at: 2.4, exit: 4.4, length: 5.3, flood: true },
        handover: { label: "Handover", who: "Your team", human: true, at: 2.15, exit: 3.6, length: 4.5, flood: false },
      };
      const STARTS = TICKETS.map((_, i) => TICKETS.slice(0, i).reduce((sum, ticket) => sum + OUTCOME[ticket.outcome].length, 0));
      const LOOP = STARTS[STARTS.length - 1] + OUTCOME[TICKETS[TICKETS.length - 1].outcome].length;

      // When each step starts, in seconds from the start of a ticket.
      const T = {
        words: 0,       // the message appears on the front card
        read: 0.45,     // AI Agent's mark appears
        sweep: 0.5,     // the highlight crosses the message
        open: 1.0,      // the card opens
        intent: 1.15,
        skill: 1.65,
      };
      const SWEEP = 0.5, FOLD = 0.35;
      // Card swap: it starts a beat after the card begins to close. dip: how far the card drops below the stack.
      const SWAP = { delay: 0.25, length: 0.6, dip: 46 };

      // Geometry, in stage pixels.
      const STAGE = { w: 760, h: 276 };
      const CY = 126;                 // vertical centre of the card
      const X = 120;                  // left edge of the card
      const H_CLOSED = 72;
      const GROW = 71;                // how far the card opens for the row under the message
      const FLOOD_FROM = { x: X + 24 + 150 + 30 + 112 + 30 + 44, y: CY - (H_CLOSED + GROW) / 2 + H_CLOSED + 42 };
      // Stack poses, front to back: [y, scale, opacity].
      const POSE = [[0, 1, 1], [-11, 0.94, 0.75], [-21, 0.88, 0.45]];

      const root = document.querySelector(".microanimation");
      const stage = root.querySelector(".stage");
      const q = (s) => stage.querySelector(s);
      const qa = (s) => [...stage.querySelectorAll(s)];
      const wash = q(".wash");
      const [ghostBack, ghostNext] = qa(".ghost");
      const front = q(".front");
      const body = q(".card-body");
      const messageText = q(".message-text");
      const sweepMark = q(".sweep");
      const agent = q(".agent");
      const agentMark = q(".agent svg");
      const route = q(".route");
      const steps = qa(".step");
      const arrows = qa(".arrow");
      const values = qa(".value");
      const outcomeLabel = q(".step:last-child .mono");
      const badge = q(".badge");
      const avatar = q(".avatar");
      const AVATAR_SCALE = 20 / 26;   // the badge's picture is smaller than the mark beside the message
      const buttons = qa(".dots button");
      const fills = qa(".dots b");
      const hint = q(".hint");

      // Easing: the brand curves, as cubic beziers.
      const clamp = (v) => Math.min(1, Math.max(0, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const bezier = (x1, y1, x2, y2) => {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        const xAt = (s) => ((ax * s + bx) * s + cx) * s;
        const yAt = (s) => ((ay * s + by) * s + cy) * s;
        return (x) => {
          if (x <= 0) return 0;
          if (x >= 1) return 1;
          let lo = 0, hi = 1, s = x;
          for (let i = 0; i < 24; i++) { xAt(s) < x ? (lo = s) : (hi = s); s = (lo + hi) / 2; }
          return yAt(s);
        };
      };
      const EASE = {
        out: bezier(0.16, 1, 0.3, 1),        // arrive and settle
        glide: bezier(0.5, 0, 0.2, 1),       // travel: leaves promptly, lands softly
        back: bezier(0.34, 1.56, 0.64, 1),   // pop with a small overshoot
        inOut: bezier(0.65, 0, 0.35, 1),
        spin: bezier(0.4, 0.2, 0.3, 1),
        line: (x) => x,
      };
      const seg = (u, start, length, ease = EASE.out) => ease(clamp((u - start) / length));
      const place = (el, y, scale) => { el.style.transform = `translate(${X}px, ${y}px) scale(${scale})`; };
      // A card on its way from one place in the stack to another.
      const pose = (el, top, from, to, k) => {
        place(el, top + lerp(POSE[from][0], POSE[to][0], k), lerp(POSE[from][1], POSE[to][1], k));
        el.style.opacity = lerp(POSE[from][2], POSE[to][2], k);
      };

      let current = -1;
      let messageW = 0;
      let toBadge = { x: 0, y: 0 };   // from the mark's place beside the message to the badge's picture
      const floodR = Math.max(...[[0, 0], [STAGE.w, 0], [0, STAGE.h], [STAGE.w, STAGE.h]].map(([x, y]) => Math.hypot(x - FLOOD_FROM.x, y - FLOOD_FROM.y)));

      // Where an element's centre sits inside the front card, whatever the animation has done to it.
      // offsetLeft and offsetTop count from the nearest ancestor that is positioned or transformed,
      // and that ancestor changes once the animation sets a transform. So this adds up every step
      // from the element to the card, with the border of each ancestor on the way.
      const centreInCard = (el) => {
        let x = el.offsetWidth / 2, y = el.offsetHeight / 2;
        for (let node = el; node !== front; node = node.offsetParent) {
          const parent = node.offsetParent;
          if (!parent) throw new Error("The element is not inside the front card.");
          x += node.offsetLeft + (parent === front ? 0 : parent.clientLeft);
          y += node.offsetTop + (parent === front ? 0 : parent.clientTop);
        }
        return { x, y };
      };
      // How far the mark travels from beside the message to the badge's picture.
      // Call it only once the card holds its words: an empty label has no height.
      function measureTravel() {
        const from = centreInCard(agent), to = centreInCard(avatar);
        toBadge = { x: to.x - from.x, y: to.y - from.y };
      }

      // Put one ticket's words on the card and measure the message.
      function setTicket(index) {
        const ticket = TICKETS[index], outcome = OUTCOME[ticket.outcome];
        messageText.textContent = ticket.message;
        messageW = messageText.offsetWidth;
        values[0].textContent = ticket.intent;
        values[1].textContent = ticket.skill || NO_SKILL;
        steps[1].classList.toggle("is-empty", !ticket.skill);
        outcomeLabel.textContent = outcome.label;
        values[2].textContent = outcome.who;
        badge.classList.toggle("is-human", outcome.human);
        measureTravel();
        current = index;
      }

      const locate = (t) => {
        const time = ((t % LOOP) + LOOP) % LOOP;
        let index = 0;
        STARTS.forEach((start, i) => { if (time >= start) index = i; });
        return { index, u: time - STARTS[index] };
      };

      function render(t) {
        const { index, u } = locate(t);
        if (index !== current) setTicket(index);
        const outcome = OUTCOME[TICKETS[index].outcome];
        const swapAt = outcome.exit + SWAP.delay;
        const stepAt = [T.intent, T.skill, outcome.at];

        // The front card opens around its centre for the row, then closes again.
        const fold = seg(u, outcome.exit, FOLD, EASE.inOut);
        const open = seg(u, T.open, 0.45, EASE.inOut) * (1 - fold);
        const top = CY - (H_CLOSED + GROW * open) / 2;
        route.style.height = GROW * open + "px";

        // Card swap: the closed ticket drops out of the stack and tucks in at the back,
        // while the two cards behind it move forward. The stack then looks as it did at the start.
        const swap = seg(u, swapAt, SWAP.length, EASE.inOut);
        const advance = seg(u, swapAt + 0.15, SWAP.length - 0.15, EASE.inOut);
        place(front, top + lerp(POSE[0][0], POSE[2][0], swap) + SWAP.dip * Math.sin(Math.PI * swap), lerp(POSE[0][1], POSE[2][1], swap));
        front.style.opacity = lerp(POSE[0][2], POSE[2][2], clamp((swap - 0.5) / 0.5));
        front.style.zIndex = swap < 0.5 ? 3 : 0;       // it passes behind the stack at the bottom of its drop
        ghostNext.style.zIndex = 2;
        ghostBack.style.zIndex = 1;
        pose(ghostNext, top, 1, 0, advance);
        pose(ghostBack, top, 2, 1, advance);
        body.style.opacity = seg(u, T.words, 0.3, EASE.line) * (1 - seg(u, swapAt, 0.25, EASE.line));

        // AI Agent reads: the mark turns, a highlight crosses the message and fades.
        // On a response the mark then travels into AI Agent's badge and leaves with the row.
        const travel = outcome.human ? 0 : seg(u, outcome.at - 0.4, 0.55, EASE.glide);
        const leaves = outcome.human ? 0 : seg(u, outcome.exit, 0.2, EASE.line);
        const size = (0.55 + 0.45 * seg(u, T.read, 0.5, EASE.back)) * lerp(1, AVATAR_SCALE, travel);
        agent.style.opacity = clamp((u - T.read) / 0.15) * (1 - leaves);
        agent.style.transform = `translate(${toBadge.x * travel}px, ${toBadge.y * travel + 6 * Math.sin(Math.PI * travel)}px) scale(${size})`;
        agentMark.style.transform = `rotate(${240 * seg(u, T.read + 0.05, T.skill - T.read, EASE.spin) + 8 * t}deg)`;
        sweepMark.style.width = (messageW + 12) * seg(u, T.sweep, SWEEP, EASE.inOut) + "px";
        sweepMark.style.opacity = 1 - seg(u, T.sweep + SWEEP, 0.4, EASE.line);

        // The row fills in from left to right: intent, skill, outcome.
        steps.forEach((step, i) => {
          const k = seg(u, stepAt[i], 0.5);
          step.style.opacity = clamp(k * 1.5) * (1 - seg(u, outcome.exit, 0.2, EASE.line));
          step.style.transform = `translateY(${(1 - k) * 6}px)`;
          step.style.filter = k < 1 ? `blur(${(1 - k) * 3}px)` : "none";
        });
        arrows.forEach((arrow, i) => { arrow.style.transform = `scaleX(${seg(u, stepAt[i + 1] - 0.1, 0.35)})`; });
        badge.style.transform = `scale(${0.8 + 0.2 * seg(u, outcome.at, 0.5, EASE.back)})`;

        // A response floods the box with sage, from the outcome outwards. A handover does not.
        const flood = outcome.flood ? seg(u, outcome.at + 0.05, 1.1) : 0;
        wash.style.clipPath = `circle(${flood * floodR}px at ${FLOOD_FROM.x}px ${FLOOD_FROM.y}px)`;
        wash.style.opacity = 1 - seg(u, outcome.exit, FOLD, EASE.line);

        buttons.forEach((button, i) => { button.classList.toggle("is-active", i === index); });
        fills.forEach((fill, i) => { fill.style.transform = `scaleX(${i === index ? u / outcome.length : 0})`; });
      }

      // Scale the 760 x 276 stage to the box.
      const fit = () => { stage.style.transform = `scale(${root.clientWidth / STAGE.w})`; };
      new ResizeObserver(fit).observe(root);
      fit();

      const frozen = new URLSearchParams(location.search).get("t");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // A ticket's finished outcome, for stills.
      const stillOf = (i) => STARTS[i] + OUTCOME[TICKETS[i].outcome].exit - 0.3;
      let clock = 0;

      buttons.forEach((button, i) => {
        const name = TICKETS[i].intent;
        button.setAttribute("aria-label", `Show example ${i + 1} of ${TICKETS.length}: ${name}`);
        button.addEventListener("click", () => {
          clock = STARTS[i];
          if (frozen !== null || reduce) render(stillOf(i));
        });
        const show = () => { hint.textContent = name; hint.classList.add("is-shown"); };
        const hide = () => { hint.classList.remove("is-shown"); };
        button.addEventListener("pointerenter", show);
        button.addEventListener("pointerleave", hide);
        button.addEventListener("focus", show);
        button.addEventListener("blur", hide);
      });

      function start() {
        root.classList.toggle("is-still", frozen !== null || reduce);
        stage.style.visibility = "visible";
        if (frozen !== null) { render(Number(frozen) || 0); return; }
        if (reduce) { render(stillOf(0)); return; }

        // Clock that only advances while the tab is visible.
        let last = null;
        const frame = (now) => {
          if (last !== null && !document.hidden) clock += Math.min(now - last, 100) / 1000;
          last = now;
          render(clock % LOOP);
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      }

      // Wait for the fonts, because the animation measures the words.
      const faces = ['500 10px "Red Hat Mono"', "500 13px Inter"];
      Promise.all(faces.map((face) => document.fonts.load(face)))
        .catch((error) => { console.warn("A font did not load; the animation uses a fallback face.", error); })
        .then(() => document.fonts.ready)
        .then(start);
    })();
  </script>
</body>
</html>

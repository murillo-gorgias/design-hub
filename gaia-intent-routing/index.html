<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent intent routing microanimation</title>
  <meta name="robots" content="noindex, nofollow" />
  <!--
    AI Agent intent routing, an onboarding illustration (760 x 276). Design exploration.

    One loop = three tickets of 12.8 s. Each ticket: the ticket arrives, AI Agent reads it
    and marks the key words, the intent lands in a chip, then the outcome shows on a colour
    field (Response: AI Agent replies; Handover: the team takes over). The outcome holds,
    then the card swap sends the ticket to the back of the stack.

    The three bars at the bottom left jump to a ticket. ?t=<seconds> freezes the loop.
    Reduced motion shows the first ticket's outcome, still.
  -->
  <style>
    @font-face {
      font-family: "Feature Deck";
      font-weight: 400;
      font-style: normal;
      font-display: block;
      src: url(assets/fonts/FeatureDeck-Regular-Web.woff2) format("woff2");
    }
    @font-face {
      font-family: "Red Hat Mono";
      font-weight: 500;
      font-style: normal;
      font-display: block;
      src: url(assets/fonts/RedHatMono-Medium-Web.woff2) format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
      src: url(assets/fonts/InterVariable.woff2) format("woff2");
    }
    :root {
      --cream: #F8F5F1;
      --white: #FFFFFF;
      --ink: #1B1A19;
      --head: #252423;
      --body: #363433;
      --text: #5F5C59;
      --mute: #8E8985;
      --border: #E8E2DC;
      --coral: #FB6B4B;
      --rose: #FFD2C9;
      --peach: #FFEAE6;
      --amber: #FFD896;
      --orchid: #F7D1FB;
      --sage: #C7EBC2;
      --sage-deep: #A9DCA2;
      --lift: 0 1px 2px rgba(27,26,25,.05), 0 10px 26px rgba(27,26,25,.07);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    p { margin: 0; }

    .microanimation {
      position: relative;
      width: min(100%, 760px);
      aspect-ratio: 760 / 276;
      overflow: hidden;
      border-radius: 8px;
      background: var(--cream);
    }
    /* Drawing surface, always 760 x 276, scaled down to the box when it is narrower. */
    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 760px;
      height: 276px;
      transform-origin: 0 0;
    }
    .scene { position: absolute; inset: 0; visibility: hidden; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* Flat colour field behind the outcome. */
    .disc {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      opacity: 0;
      will-change: transform, opacity;
    }
    .disc.field { width: 620px; height: 620px; margin: -310px 0 0 -310px; }
    .rings { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .rings circle { fill: none; stroke-width: 1; }
    /* The cards take z-index 0 to 3 during the swap. Everything that sits on them stays above. */
    .side, .rings.over, .token, .badge { z-index: 4; }

    /* The stack of tickets */
    .card {
      position: absolute;
      left: 0;
      top: 0;
      width: 360px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: var(--lift);
      transform-origin: 50% 0;
      will-change: transform, opacity;
    }
    .card.ghost { height: 102px; }   /* same as the closed ticket, so the swap hands over cleanly */
    .card.front { padding: 16px 18px 18px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; height: 26px; }
    .from { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 12px; font-weight: 500; }
    .from-icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--cream); color: var(--text); }
    .from-icon svg { width: 14px; height: 14px; }
    .agent-name { margin-right: 34px; color: var(--text); font-size: 12px; font-weight: 500; opacity: 0; }
    .message {
      position: relative;
      width: max-content;
      margin-top: 12px;
      color: var(--ink);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -.015em;
      line-height: 28px;
      white-space: nowrap;
    }
    .message-text { position: relative; }
    .mark-sweep, .mark-key { position: absolute; top: 1px; height: 27px; border-radius: 6px; }
    .mark-sweep { left: -5px; width: 0; background: var(--peach); }
    .mark-key { background: var(--rose); opacity: 0; }
    .intent { display: flow-root; height: 0; overflow: hidden; }
    .intent-row { display: flex; align-items: center; gap: 10px; height: 26px; margin-top: 12px; }
    .mono {
      color: var(--text);
      font-family: "Red Hat Mono", ui-monospace, Menlo, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .08em;
      line-height: 12px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .mono .dot { display: inline-block; width: 6px; height: 6px; margin: 0 7px 1px 0; border-radius: 50%; background: var(--coral); vertical-align: middle; }
    .chip {
      height: 26px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--cream);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 24px;
      white-space: nowrap;
      transform-origin: 0 50%;
      opacity: 0;
    }

    /* The outcome, set straight on the colour field */
    .side { position: absolute; left: 428px; top: 0; width: 296px; will-change: transform, opacity; }
    .side > * { position: absolute; left: 0; }
    .side-label { top: 50px; color: var(--body); }
    .side-title {
      top: 65px;
      color: var(--ink);
      font-family: "Feature Deck", Georgia, serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -.01em;
      line-height: 40px;
      white-space: nowrap;
    }
    .reply {
      top: 118px;
      width: 296px;
      height: 58px;
      padding: 10px 14px 10px 46px;
      border-radius: 14px;
      background: var(--white);
      box-shadow: var(--lift);
    }
    .reply-text { color: var(--head); font-size: 13px; font-weight: 500; line-height: 19px; }
    .reply-text span { display: inline-block; opacity: 0; }
    .reply .typing { position: absolute; left: 47px; top: 17px; }
    .typing { display: flex; gap: 4px; }
    .typing i { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--mute); }
    .team { top: 118px; display: flex; align-items: center; height: 40px; }
    .avatar {
      position: relative;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      margin-right: -9px;
      border: 2px solid var(--white);
      border-radius: 50%;
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      opacity: 0;
    }
    .avatar:nth-child(1) { z-index: 3; background: var(--amber); }
    .avatar:nth-child(2) { z-index: 2; background: var(--orchid); }
    .avatar:nth-child(3) { z-index: 1; background: var(--sage); }
    .team-bubble {
      display: grid;
      place-items: center;
      height: 32px;
      margin-left: 23px;
      padding: 0 13px;
      border-radius: 16px 16px 16px 5px;
      background: var(--white);
      box-shadow: var(--lift);
      transform-origin: 0 100%;
      opacity: 0;
    }
    .done {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 13px 0 4px;
      border-radius: 999px;
      background: var(--white);
      color: var(--head);
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
      transform-origin: 0 50%;
      opacity: 0;
    }
    .done svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* AI Agent's mark and the ticket's "1": they travel, so they sit on the stage itself. */
    .token, .badge { position: absolute; left: 0; top: 0; border-radius: 50%; opacity: 0; will-change: transform, opacity; }
    .token { display: grid; place-items: center; width: 26px; height: 26px; margin: -13px 0 0 -13px; background: var(--ink); color: #FCFAF8; }
    .token svg { width: 15px; height: 15px; }
    .badge {
      display: grid;
      place-items: center;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      box-shadow: 0 0 0 2px var(--white);
      background: var(--coral);
      color: var(--white);
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }
    .badge.check { background: var(--sage-deep); color: var(--ink); }
    .badge.check svg { width: 9px; height: 9px; }

    /* Place in the loop. Click a bar to jump to that ticket. */
    .progress { position: absolute; left: 36px; top: 244px; display: flex; gap: 5px; }
    .progress button { all: unset; display: grid; align-items: center; width: 26px; height: 18px; cursor: pointer; }
    .progress button span { display: block; height: 3px; overflow: hidden; border-radius: 2px; background: rgba(27,26,25,.13); }
    .progress button b { display: block; height: 100%; background: rgba(27,26,25,.6); transform: scaleX(0); transform-origin: 0 50%; }
    .progress button:hover span { background: rgba(27,26,25,.24); }
    .progress button:focus-visible span { outline: 2px solid var(--ink); outline-offset: 2px; }
  </style>
</head>

  <section class="microanimation" aria-labelledby="summary">
    <p id="summary" class="sr-only">AI Agent reads the intent of each incoming ticket. It responds when a skill matches the intent and hands the rest over to your team.</p>
    <div class="stage">
      <div class="scene" aria-hidden="true">
        <div class="disc field"></div>
        <svg class="rings" viewBox="0 0 760 276">
          <circle class="ring-field" /><circle class="ring-field" />
        </svg>

        <div class="card ghost"></div>
        <div class="card ghost"></div>
        <div class="card front">
          <div class="card-body">
            <div class="card-head">
              <span class="from"><span class="from-icon"><svg><use href="#mail" /></svg></span>New ticket</span>
              <span class="agent-name">AI Agent</span>
            </div>
            <p class="message">
              <span class="mark-sweep"></span><span class="mark-key"></span><span class="mark-key"></span>
              <span class="message-text"></span>
            </p>
            <div class="intent">
              <div class="intent-row">
                <span class="mono intent-label"><span class="dot"></span>Intent</span>
                <span class="chip"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="side">
          <p class="mono side-label"><span class="dot"></span><span class="side-label-text"></span></p>
          <p class="side-title"></p>
          <div class="reply">
            <p class="reply-text"></p>
            <span class="typing"><i></i><i></i><i></i></span>
          </div>
          <div class="team">
            <span class="avatar">MR</span><span class="avatar">JL</span><span class="avatar">AK</span>
            <span class="team-bubble"><span class="typing"><i></i><i></i><i></i></span></span>
          </div>
          <div class="done"><svg><use href="#response" /></svg><span class="done-text"></span></div>
        </div>

        <svg class="rings over" viewBox="0 0 760 276">
          <circle class="ring-read" stroke="#FB6B4B" /><circle class="ring-read" stroke="#FB6B4B" />
        </svg>
        <div class="token"><svg><use href="#mark" /></svg></div>
        <div class="badge one">1</div>
        <div class="badge check"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.3 4.1 7.4 8 3" /></svg></div>
      </div>

      <nav class="progress" aria-label="Example tickets">
        <button type="button"><span><b></b></span></button>
        <button type="button"><span><b></b></span></button>
        <button type="button"><span><b></b></span></button>
      </nav>
    </div>
  </section>

  <script>
    (() => {
      const CYCLE = 12.8;
      const TICKETS = [
        { words: ["Where", "is", "my", "order?"], keys: [[0, 0], [3, 3]], intent: "Order status", outcome: "response",
          reply: "Your order shipped yesterday. It arrives on Thursday." },
        { words: ["An", "item", "is", "missing", "from", "my", "order"], keys: [[1, 3]], intent: "Missing item", outcome: "handover" },
        { words: ["Do", "you", "ship", "to", "Canada?"], keys: [[2, 4]], intent: "International shipping", outcome: "response",
          reply: "Yes, we ship to Canada. Delivery takes 5 to 8 days." },
      ];
      const LOOP = CYCLE * TICKETS.length;
      // Copy comes from the diagram in the product today. dy centres each block on the stage.
      const OUTCOME = {
        response: { label: "A skill matches the intent", title: "Response", done: "AI Agent handles the conversation",
                    icon: "#response", tint: "#C7EBC2", deep: "#A9DCA2", dy: 0, doneTop: 188 },
        handover: { label: "AI Agent escalates", title: "Handover", done: "Your team takes over",
                    icon: "#handover", tint: "#C7CCFD", deep: "#9FA7F8", dy: 8, doneTop: 170 },
      };

      // When each step starts, in seconds from the start of a ticket.
      const T = {
        badge: 0.5,     // the "1" pops onto the mail icon
        agent: 1.5,     // AI Agent's mark flies in
        sweep: 1.95,    // highlight crosses the message (0.9 s)
        open: 3.2,      // the ticket opens for the intent
        chip: 3.4,      // the intent chip pops
        shake: 3.85,    // handover only: the mark shakes
        shift: 4.3,     // ticket slides left, the colour field opens
        fly: 4.95,      // response: the mark flies to the reply bubble
        stream: 6.0,    // response: the reply writes itself (1.2 s)
        check: 7.35,    // response: the "1" turns into a check
        hand: 5.6,      // handover: the "1" flies to a teammate (0.8 s)
        exit: 11.4,      // the outcome leaves, the ticket empties and goes home
        swap: 11.85,     // the card swap (0.85 s)
      };

      // Geometry, in stage pixels.
      const CY = 132;                 // vertical centre of the content
      const CARD_W = 360;
      const H_CLOSED = 102;
      const GROW = 38;                // how far the ticket opens for the intent
      const X_CENTER = 200;
      const X_LEFT = 36;
      const FIELD = { x: 640, y: 132 };
      const FIELD_R = 310;
      const SIDE_X = 428;
      const BODY_TOP = 118;           // top of the reply bubble and of the team row
      // Stack poses, front to back: [y, scale, opacity].
      const POSE = [[0, 1, 1], [-11, 0.94, 0.75], [-21, 0.88, 0.45], [-29, 0.82, 0]];
      // Card swap: how far the ticket dips below the stack, drifts right and tilts on its way back.
      const SWAP = { length: 0.85, dip: 52, drift: 18, tilt: 3 };
      const CREAM = "#F8F5F1", BORDER = "#E8E2DC";

      const root = document.querySelector(".microanimation");
      const stage = root.querySelector(".stage");
      const q = (s) => stage.querySelector(s);
      const qa = (s) => [...stage.querySelectorAll(s)];
      const scene = q(".scene");
      const field = q(".disc.field");
      const fieldRings = qa(".ring-field");
      const readRings = qa(".ring-read");
      const [ghostBack, ghostNext] = qa(".ghost");
      const front = q(".front");
      const body = q(".card-body");
      const agentName = q(".agent-name");
      const messageText = q(".message-text");
      const sweepMark = q(".mark-sweep");
      const keyMarks = qa(".mark-key");
      const intent = q(".intent");
      const intentLabel = q(".intent-label");
      const chip = q(".chip");
      const side = q(".side");
      const sideLabel = q(".side-label");
      const sideLabelText = q(".side-label-text");
      const sideTitle = q(".side-title");
      const reply = q(".reply");
      const replyText = q(".reply-text");
      const replyDots = qa(".reply .typing i");
      const team = q(".team");
      const avatars = qa(".avatar");
      const teamBubble = q(".team-bubble");
      const teamDots = qa(".team-bubble .typing i");
      const done = q(".done");
      const doneIcon = q(".done use");
      const doneText = q(".done-text");
      const token = q(".token");
      const tokenMark = q(".token svg");
      const badgeOne = q(".badge.one");
      const badgeCheck = q(".badge.check");
      const bars = qa(".progress button");
      const fills = qa(".progress b");

      // Easing: the five brand curves, as cubic beziers.
      const clamp = (v) => Math.min(1, Math.max(0, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const bezier = (x1, y1, x2, y2) => {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        const xAt = (s) => ((ax * s + bx) * s + cx) * s;
        const yAt = (s) => ((ay * s + by) * s + cy) * s;
        return (x) => {
          if (x <= 0) return 0;
          if (x >= 1) return 1;
          let lo = 0, hi = 1, s = x;
          for (let i = 0; i < 24; i++) { xAt(s) < x ? (lo = s) : (hi = s); s = (lo + hi) / 2; }
          return yAt(s);
        };
      };
      const EASE = {
        out: bezier(0.16, 1, 0.3, 1),        // arrive and settle
        glide: bezier(0.5, 0, 0.2, 1),       // travel: leaves promptly, lands softly
        back: bezier(0.34, 1.56, 0.64, 1),   // pop with a small overshoot
        in: bezier(0.55, 0, 0.8, 0.4),       // leave
        inOut: bezier(0.65, 0, 0.35, 1),
        spin: bezier(0.4, 0.2, 0.3, 1),
        line: (x) => x,
      };
      const seg = (u, start, length, ease = EASE.out) => ease(clamp((u - start) / length));

      const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
      const mix = (a, b, k) => {
        const from = rgb(a), to = rgb(b);
        return `rgb(${from.map((v, i) => Math.round(lerp(v, to[i], k))).join(",")})`;
      };
      const at = (el, x, y, extra = "") => { el.style.transform = `translate(${x}px, ${y}px) ${extra}`; };
      // House entrance: fade up from a light blur.
      const arrive = (el, k, rise = 10, extra = "") => {
        el.style.opacity = clamp(k * 1.5);
        el.style.transform = `translateY(${(1 - k) * rise}px) ${extra}`;
        el.style.filter = k < 1 ? `blur(${(1 - k) * 5}px)` : "none";
      };
      const pose = (el, x, top, from, to, k) => {
        const y = top + lerp(POSE[from][0], POSE[to][0], k);
        const s = lerp(POSE[from][1], POSE[to][1], k);
        at(el, x, y, `scale(${s})`);
        return lerp(POSE[from][2], POSE[to][2], k);
      };
      const bounce = (dots, u) => dots.forEach((dot, i) => {
        const lift = Math.sin(Math.PI * clamp((((u * 1.5 - i * 0.16) % 1) + 1) % 1 / 0.5));
        dot.style.transform = `translateY(${-3.2 * lift}px)`;
        dot.style.opacity = 0.4 + 0.6 * lift;
      });

      let current = -1;
      let messageW = 0, chipX = 0, replyWords = [];

      // Put one ticket's words on the stage and measure what the animation needs.
      function setTicket(index) {
        const ticket = TICKETS[index], outcome = OUTCOME[ticket.outcome];
        messageText.replaceChildren(...ticket.words.flatMap((word, i) => {
          const el = document.createElement("span");
          el.textContent = word;
          return i ? [" ", el] : [el];
        }));
        const words = [...messageText.children];
        messageW = messageText.offsetWidth;
        keyMarks.forEach((mark, i) => {
          const group = ticket.keys[i];
          mark.style.display = group ? "block" : "none";
          if (!group) return;
          const first = words[group[0]], last = words[group[1]];
          mark.style.left = first.offsetLeft - 5 + "px";
          mark.style.width = last.offsetLeft + last.offsetWidth - first.offsetLeft + 10 + "px";
        });

        chip.textContent = ticket.intent;
        chipX = 18 + intentLabel.offsetWidth + 10 + chip.offsetWidth / 2;

        sideLabelText.textContent = outcome.label;
        sideTitle.textContent = outcome.title;
        doneText.textContent = outcome.done;
        doneIcon.setAttribute("href", outcome.icon);
        done.style.top = outcome.doneTop + "px";
        field.style.background = outcome.tint;
        fieldRings.forEach((ring) => ring.setAttribute("stroke", outcome.deep));
        const isResponse = ticket.outcome === "response";
        reply.style.display = isResponse ? "block" : "none";
        team.style.display = isResponse ? "none" : "flex";
        replyWords = (ticket.reply || "").split(" ").map((word) => {
          const el = document.createElement("span");
          el.textContent = word;
          return el;
        });
        replyText.replaceChildren(...replyWords.flatMap((el, i) => (i ? [" ", el] : [el])));
        current = index;
      }

      function render(t) {
        const index = Math.floor(t / CYCLE) % TICKETS.length;
        const u = t % CYCLE;
        if (index !== current) setTicket(index);
        const ticket = TICKETS[index];
        const outcome = OUTCOME[ticket.outcome];
        const isResponse = ticket.outcome === "response";

        // The stack floats a little until the outcome shows, then holds still until it goes home.
        // The outcome floats all the time.
        const calm = seg(u, T.shift, 0.75, EASE.glide) * (1 - seg(u, T.exit + 0.05, 0.55, EASE.glide));
        const floatA = 2 * Math.sin((2 * Math.PI * t) / (LOOP / 5)) * (1 - calm);
        const floatB = 2 * Math.sin((2 * Math.PI * t) / (LOOP / 4) + 1.3);

        const shift = seg(u, T.shift, 0.75, EASE.glide);
        const exit = seg(u, T.exit, 0.3, EASE.in);
        const home = seg(u, T.exit + 0.05, 0.55, EASE.glide);
        const fold = seg(u, T.exit + 0.05, 0.4, EASE.inOut);    // the ticket closes back to its first height
        const open = seg(u, T.open, 0.5, EASE.inOut) * (1 - fold);

        // The stack: the front ticket opens around its centre, slides left, then glides home.
        const cardH = H_CLOSED + GROW * open;
        const top = CY - cardH / 2 + floatA;
        const slidX = lerp(X_CENTER, X_LEFT, shift);
        const frontX = lerp(slidX, X_CENTER, home);

        // Card swap: the empty ticket dips out of the stack and tucks in at the back.
        // The cards behind it move forward a beat later. At the end the stack looks exactly
        // as it did at the start, so the next ticket's words appear on the front card.
        const swap = seg(u, T.swap, SWAP.length, EASE.inOut);
        const advance = seg(u, T.swap + 0.18, SWAP.length - 0.18, EASE.inOut);
        const tuck = Math.sin(Math.PI * swap);
        const frontScale = lerp(POSE[0][1], POSE[2][1], swap);
        at(front, frontX + SWAP.drift * tuck, top + lerp(POSE[0][0], POSE[2][0], swap) + SWAP.dip * tuck,
           `rotate(${SWAP.tilt * tuck}deg) scale(${frontScale})`);
        // Solid until it passes behind the stack, then it fades to the back card's strength.
        front.style.opacity = lerp(POSE[0][2], POSE[2][2], clamp((swap - 0.5) / 0.5));
        front.style.zIndex = swap < 0.5 ? 3 : 0;               // passes behind the stack at the bottom of its dip
        ghostNext.style.zIndex = 2;
        ghostBack.style.zIndex = 1;
        ghostNext.style.opacity = pose(ghostNext, frontX, top, 1, 0, advance);
        ghostBack.style.opacity = pose(ghostBack, frontX, top, 2, 1, advance);
        // The words ride the ticket out of the stack and fade as it tucks in behind.
        body.style.opacity = seg(u, 0.15, 0.4, EASE.line) * (1 - seg(u, T.swap + 0.25, 0.3, EASE.line));

        // Reading: a highlight crosses the message, then only the key words stay marked.
        const settle = seg(u, T.sweep + 0.9, 0.4, EASE.line);
        sweepMark.style.width = (messageW + 10) * seg(u, T.sweep, 0.9, EASE.inOut) + "px";
        sweepMark.style.opacity = 1 - settle;
        keyMarks.forEach((mark) => { mark.style.opacity = settle; });

        // The intent lands in a chip, which takes the outcome's colour once that is known.
        intent.style.height = GROW * open + "px";
        intent.style.opacity = 1 - fold;
        intent.style.overflow = open < 1 ? "hidden" : "visible";
        intentLabel.style.opacity = seg(u, T.chip - 0.05, 0.3, EASE.line);
        chip.style.opacity = clamp((u - T.chip) / 0.12);
        chip.style.transform = `scale(${0.7 + 0.3 * seg(u, T.chip, 0.45, EASE.back)})`;
        const tinted = seg(u, T.shift, 0.5, EASE.line);
        chip.style.backgroundColor = mix(CREAM, outcome.tint, tinted);
        chip.style.borderColor = mix(BORDER, outcome.deep, tinted);

        // Colour field: opens from the intent chip, then settles on the right.
        const wipe = seg(u, T.shift, 0.95);
        const close = seg(u, T.exit, 0.45, EASE.in);
        const chipAtShift = { x: X_CENTER + chipX, y: CY - (H_CLOSED + GROW) / 2 + 107 };
        const fieldX = lerp(chipAtShift.x, FIELD.x, wipe), fieldY = lerp(chipAtShift.y, FIELD.y, wipe);
        at(field, fieldX, fieldY, `scale(${wipe * (1 - close)})`);
        field.style.opacity = u >= T.shift ? 1 : 0;
        const rippling = seg(u, T.shift + 0.7, 0.5, EASE.line) * (1 - seg(u, T.exit - 0.25, 0.25, EASE.line));
        fieldRings.forEach((ring, i) => {
          const p = (u / 3.2 + i * 0.5) % 1;
          ring.setAttribute("cx", FIELD.x);
          ring.setAttribute("cy", FIELD.y);
          ring.setAttribute("r", FIELD_R + 5 + 46 * p);
          ring.style.opacity = rippling * (1 - p) * clamp(p * 8) * 0.9;
        });

        // The outcome builds on the field: label, title, then the reply or the team.
        const sideY = outcome.dy + floatB;
        at(side, -10 * exit, sideY);
        side.style.opacity = 1 - exit;
        side.style.filter = exit > 0 ? `blur(${4 * exit}px)` : "none";
        arrive(sideLabel, seg(u, T.shift + 0.4, 0.55));
        arrive(sideTitle, seg(u, T.shift + 0.5, 0.6));

        // AI Agent's mark: flies in, turns while it reads, then answers or steps back.
        const dock = { x: frontX + CARD_W - 31, y: top + 29 };
        const landed = seg(u, T.agent, 0.6);
        const leaving = (1 - exit);
        let tokenX = dock.x + 46 * (1 - landed), tokenY = dock.y - 38 * (1 - landed);
        let tokenScale = 0.55 + 0.45 * seg(u, T.agent, 0.6, EASE.back);
        let tokenOpacity = clamp((u - T.agent) / 0.2);
        let nameOpacity = seg(u, T.agent + 0.25, 0.35, EASE.line);
        const turn = 360 * seg(u, T.agent + 0.35, T.chip + 0.35 - (T.agent + 0.35), EASE.spin) + 6 * t;
        const reading = seg(u, T.agent + 0.45, 0.3, EASE.line) * (1 - seg(u, T.chip, 0.3, EASE.line));
        readRings.forEach((ring, i) => {
          const p = (u * 0.95 + i * 0.5) % 1;
          ring.setAttribute("cx", tokenX);
          ring.setAttribute("cy", tokenY);
          ring.setAttribute("r", 13 + 14 * p);
          ring.style.opacity = reading * (1 - p) * 0.75;
        });

        const mailBadge = { x: frontX + 41, y: top + 20 };
        let oneX = mailBadge.x, oneY = mailBadge.y;
        let oneScale = seg(u, T.badge, 0.45, EASE.back);
        let checkScale = 0;

        if (isResponse) {
          // The mark flies to the reply bubble and the reply writes itself.
          arrive(reply, seg(u, T.shift + 0.65, 0.6));
          const slot = { x: SIDE_X + 23, y: BODY_TOP + 23 + sideY };
          const fly = seg(u, T.fly, 0.7, EASE.glide);
          tokenX = lerp(tokenX, slot.x, fly) - 10 * exit;
          tokenY = lerp(tokenY, slot.y, fly) - 16 * Math.sin(Math.PI * fly);
          nameOpacity *= 1 - seg(u, T.fly, 0.25, EASE.line);
          const typing = u >= T.fly + 0.6 && u < T.stream;
          replyDots.forEach((dot) => { dot.style.visibility = typing ? "visible" : "hidden"; });
          bounce(replyDots, u);
          const step = 1.2 / Math.max(1, replyWords.length - 1);
          replyWords.forEach((word, i) => {
            const k = seg(u, T.stream + i * step, 0.3);
            word.style.opacity = k;
            word.style.transform = `translateY(${(1 - k) * 4}px)`;
          });
          // Resolved: the ticket's "1" turns into a check.
          oneScale *= 1 - seg(u, T.check, 0.12, EASE.in);
          checkScale = seg(u, T.check + 0.12, 0.45, EASE.back);
          done.style.opacity = clamp((u - (T.check + 0.2)) / 0.12);
          done.style.transform = `scale(${0.8 + 0.2 * seg(u, T.check + 0.2, 0.5, EASE.back)})`;
        } else {
          // The mark shakes, then steps back while the team arrives.
          const shake = clamp((u - T.shake) / 0.45);
          tokenX += 3 * Math.sin(2 * Math.PI * 4 * (u - T.shake)) * (shake > 0 && shake < 1 ? 1 - shake : 0);
          const stepBack = seg(u, T.shift + 0.1, 0.5, EASE.line);
          tokenScale *= 1 - 0.12 * stepBack;
          tokenOpacity *= 1 - 0.62 * stepBack;
          nameOpacity *= 1 - 0.55 * stepBack;
          const land = T.hand + 0.8;
          avatars.forEach((avatar, i) => {
            const k = seg(u, T.shift + 0.65 + i * 0.09, 0.55);
            const bump = i === 0 ? 0.1 * Math.sin(Math.PI * clamp((u - land + 0.05) / 0.4)) : 0;
            avatar.style.opacity = clamp(k * 1.5);
            avatar.style.transform = `translateX(${(1 - k) * 16}px) scale(${1 + bump})`;
            avatar.style.filter = k < 1 ? `blur(${(1 - k) * 5}px)` : "none";
          });
          // The ticket's "1" flies to a teammate, who starts typing.
          const hand = seg(u, T.hand, 0.8, EASE.glide);
          const seat = { x: SIDE_X + 33, y: BODY_TOP + 6 + sideY };
          oneX = lerp(mailBadge.x, seat.x, hand) - 10 * exit * hand;
          oneY = lerp(mailBadge.y, seat.y, hand) - 74 * Math.sin(Math.PI * hand);   // high arc, clear of the mark
          oneScale *= 1 + 0.25 * Math.sin(Math.PI * hand);
          teamBubble.style.opacity = clamp((u - (land + 0.15)) / 0.12);
          teamBubble.style.transform = `scale(${0.7 + 0.3 * seg(u, land + 0.15, 0.45, EASE.back)})`;
          bounce(teamDots, u);
          done.style.opacity = clamp((u - (land + 0.75)) / 0.12);
          done.style.transform = `scale(${0.8 + 0.2 * seg(u, land + 0.75, 0.5, EASE.back)})`;
        }

        at(token, tokenX, tokenY, `scale(${tokenScale})`);
        token.style.opacity = tokenOpacity * leaving;
        tokenMark.style.transform = `rotate(${turn}deg)`;
        agentName.style.opacity = nameOpacity;
        at(badgeOne, oneX, oneY, `scale(${oneScale})`);
        badgeOne.style.opacity = (u >= T.badge ? 1 : 0) * leaving;
        at(badgeCheck, mailBadge.x, mailBadge.y, `scale(${checkScale})`);
        badgeCheck.style.opacity = (checkScale > 0 ? 1 : 0) * leaving;

        fills.forEach((fill, i) => { fill.style.transform = `scaleX(${i < index ? 1 : i === index ? u / CYCLE : 0})`; });
      }

      // Scale the 760 x 276 stage to the box.
      const fit = () => { stage.style.transform = `scale(${root.clientWidth / 760})`; };
      new ResizeObserver(fit).observe(root);
      fit();

      const frozen = new URLSearchParams(location.search).get("t");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const STILL = T.exit - 0.3;     // a ticket's finished outcome
      let clock = 0;

      bars.forEach((bar, i) => {
        bar.setAttribute("aria-label", `Show ticket ${i + 1} of ${TICKETS.length}: ${TICKETS[i].words.join(" ")}`);
        bar.addEventListener("click", () => {
          clock = i * CYCLE;
          if (frozen !== null || reduce) render(clock + STILL);
        });
      });

      function start() {
        scene.style.visibility = "visible";
        if (frozen !== null) { render(Number(frozen) || 0); return; }
        if (reduce) { render(STILL); return; }

        // Clock that only advances while the tab is visible.
        let last = null;
        const tick = (now) => {
          if (last !== null && !document.hidden) clock += Math.min(now - last, 100) / 1000;
          last = now;
          render(clock % LOOP);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      // Wait for the fonts, because the animation measures the words.
      const faces = ['400 21px "Feature Deck"', '500 10px "Red Hat Mono"', "500 13px Inter", "600 13px Inter"];
      Promise.all(faces.map((face) => document.fonts.load(face)))
        .catch((error) => { console.warn("A font did not load; the animation uses a fallback face.", error); })
        .then(() => document.fonts.ready)
        .then(start);
    })();
  </script>
</body>
</html>
